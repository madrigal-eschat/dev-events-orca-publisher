services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "127.0.0.1:${MQTT_TEST_PORT:-18884}:1884"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t healthcheck -m ready"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s
  loopback-proxy:
    image: node:26-alpine
    network_mode: service:mosquitto
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./scripts/mqtt-loopback-proxy.mjs:/mqtt-loopback-proxy.mjs:ro
    command: ["node", "/mqtt-loopback-proxy.mjs"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net=require('node:net');const socket=net.connect(1884,'127.0.0.1',()=>socket.end());socket.on('error',()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s
